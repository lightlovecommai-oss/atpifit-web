name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天重建一次，讓 pubDate 排到未來的文章到期自動上線（src/lib/published.ts）。
  # 01:00 UTC ＝ 台北 09:00。
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來就讓排隊中的那個先跑完，不中斷進行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap 的 lastmod 讀每個檔的 git 最後 commit 時間，
          # 預設的淺複製（depth 1）會讓全站日期變成同一天。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 部署完把 sitemap 推給 IndexNow（Bing／Yandex／Naver 吃，Google 不吃）。
  # 排程上線的文章沒有人會記得手動跑這支，所以掛在這裡。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 這支讀的是線上的 sitemap，等 Pages CDN 換完才不會推到舊的那份
      - run: sleep 60
      - run: node scripts/indexnow.mjs
