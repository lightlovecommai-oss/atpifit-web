<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F1EC; --ink:#4A1B0C; --act:#C6603A;
  --a:#C6603A; --t:#6E8B77; --p:#6E8CA8; --i:#C99A4E; --i-dark:#8E682B;
  --muted:#7a5636;
}
body{

  font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  line-height:1.75; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:0 24px}
header{padding:72px 0 48px;text-align:center}
.brand{font-size:14px;letter-spacing:.28em;color:var(--muted);margin-bottom:20px}
h1{font-size:34px;line-height:1.4;font-weight:600;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--act)}
.sub{margin-top:20px;font-size:17px;color:var(--muted)}

.cta{display:flex;flex-direction:column;gap:12px;margin:44px 0 8px}
.btn{
  display:block;padding:17px 20px;border-radius:14px;
  font-size:18px;font-weight:600;text-decoration:none;text-align:center;
  transition:transform .15s ease,opacity .15s ease;
}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--act);color:#fff}
.btn-sub{background:transparent;color:var(--ink);border:1.5px solid rgba(74,27,12,.22)}
.btn-note{font-size:14px;font-weight:400;opacity:.75;display:block;margin-top:3px}

section{padding:48px 0;border-top:1px solid rgba(74,27,12,.1)}
h2{font-size:21px;font-weight:600;margin-bottom:8px}
.lead{color:var(--muted);font-size:16px;margin-bottom:28px}

.muscles{display:grid;gap:14px}
.m{display:flex;gap:14px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:9px}
.m-name{font-weight:600;font-size:17px}
.m-desc{color:var(--muted);font-size:15px}

.chain{font-size:15px;color:var(--muted);line-height:2.1}
.chain b{color:var(--ink);font-weight:600}

footer{padding:40px 0 56px;text-align:center;font-size:14px;color:var(--muted);border-top:1px solid rgba(74,27,12,.1)}
footer a{color:var(--act);text-decoration:none}

@media(max-width:480px){
  header{padding:52px 0 36px}
  h1{font-size:28px}
}
</style>
